; nwn5e (EE) settings. 1 = 2024 rule, 0 = the game's own behaviour. Rules
; arrive here as they are ported from the 1.69 build (docs/EE-PORT.md).
[loader]
; Leave empty for the Steam default: X:\SteamLibrary\steamapps\common\Neverwinter Nights
game_dir=

[rules]
; faithful = D&D 2024 as written; nwn = 2024 with NWN's own choices kept where
; they exist for gameplay; off = the game's behaviour. The default for every
; rule that has both versions (none ported yet); each can override it.
mode=faithful
; 2024 critical hits: a critical threat only on a natural 20 (not the
; weapon's 19-20 / 18-20; the character sheet shows 20 too).
crit_nat20_only=1
; ... and a threat is a critical hit at once: no confirmation roll, no
; "Threat Roll" in the combat log. Critical immunity still applies.
crit_no_confirmation=1
; Every weapon crits for double damage (x2, not x3 / x4).
crit_double_damage=1
; A critical rolls the damage dice twice, but Strength and other flat bonuses
; (also flat effect bonuses, e.g. Divine Favor) count once.
crit_dice_only=1
; Creatures can crit your party at every difficulty (the game turns their
; critical hits on player characters into hits at Easy and Normal).
crits_against_players=1
; Write each rule decision to nwn5e.log (once per distinct case).
log_attacks=1
; Attack rolls use the proficiency bonus (by level for characters, by
; challenge rating for monsters) instead of the 3e base attack bonus; the
; character sheet shows the same numbers.
attack_proficiency=1
; Monsters, summons and companions use the 2024 expected AC for their
; challenge rating; player characters and henchmen keep their gear AC.
creature_ac_by_cr=1
; Player characters and henchmen attack per 2024 Extra Attack, and no attack
; takes the 3e -5 (iterative, off-hand, opportunity, Haste, Flurry).
extra_attack=1
; 2024 advantage / disadvantage instead of NWN's situational bonuses
; (blind, invisible, prone, stunned, flanked, moving targets); a ranged attack
; with an enemy within 5 ft that sees you has disadvantage (Point Blank Shot
; cancels it).
advantage_disadvantage=1
; After a kill, the round's remaining attacks go to the nearest enemy; a
; ranged attack only to an enemy already in the fight, within this range (m).
retarget_remaining_attacks=1
ranged_retarget_range=40
; NWN's racial bonuses against specific enemies (Battle Training, Good Aim,
; the halfling sling, +4 AC vs giants): faithful removes them; nwn keeps them.
racial_combat_bonuses=
; Two-weapon fighting: faithful = no attack penalties, one off-hand attack
; (two Light weapons, a double weapon or Improved Two-Weapon Fighting), no
; Strength on its damage unless negative or with Two-Weapon Fighting; nwn
; keeps NWN's.
two_weapon_fighting=
; Two-handed weapons: faithful adds Strength once, nwn keeps NWN's 1.5 x.
two_handed_strength=
; Opportunity attacks: faithful = only moving away provokes (no AoO for
; casting, drinking potions, ranged shots, unarmed attacks or Disarm), only
; from creatures you run away from, and Spring Attack no longer protects; nwn
; keeps NWN's.
opportunity_attacks=
; After drinking a potion or using Second Wind mid-fight, your character goes
; back to attacking its last target (or the nearest enemy it sees within 10 m).
resume_attack_after_potion=1
; Conditions: faithful = 2024 restrained (no -2 attack / -4 Dex; advantage
; against it, disadvantage on its attacks), stunned / paralysed / asleep
; targets give advantage (a hit from within 5 ft on a paralysed or sleeping
; one is a critical), poisoned attackers have disadvantage, frightened = no
; fleeing but disadvantage while the source is in sight, concealment =
; disadvantage instead of a miss chance, deafness adds no spell failure, no
; coup de grace; nwn keeps NWN's (stunned / paralysed / asleep targets still
; give advantage).
conditions=
; Weapon mastery: faithful = 2024 slots by class (Barbarian, Fighter,
; Paladin, Ranger, Rogue), picked as Weapon Mastery feats on the creation and
; level-up screens (with feats=faithful), or with !mastery, or filled with the
; weapons you fight with, one swap per long rest; nwn = those classes master
; every weapon they are proficient with. Weapon Focus adds its weapon in both.
; Effects: Vex, Sap, Graze, Slow, Topple, Cleave, and in faithful Push (10 ft
; away, stopped by walls and placeables; the creature falls and its round
; pauses).
weapon_mastery=
; Creature size. faithful (2024): size limits no weapon or shield - a Small
; character (halfling, gnome) wields a greatsword, spear or longbow
; two-handed and can use a tower shield; no size modifiers to AC or attack
; (NWN gives Small +1 / +1); a Small character's unarmed dice are a Medium
; one's; a Heavy weapon (greataxe, greatsword, halberd, longbow, heavy
; crossbow...) gives Disadvantage below Strength 13 (melee) or Dexterity 13
; (ranged). nwn (or off): NWN's size rules, no Heavy rule.
size=
; Finesse. faithful (2024): a Finesse weapon (dagger, dart, rapier, scimitar,
; short sword, whip; kama, kukri) uses the better of Strength and Dexterity
; for its attack and damage, no feat needed. nwn (or off): NWN's Weapon
; Finesse feat (Dexterity to attack).
finesse=
; 2024 saving throws. Fortitude / Reflex / Will are your Constitution /
; Dexterity / Wisdom saves: ability modifier + proficiency bonus in your first
; class's saves (Great Fortitude, Lightning Reflexes, Iron Will add one) +
; magic. Spell DCs are 8 + proficiency bonus + casting modifier; traps,
; poisons and other fixed DCs are converted to the 2024 scale. Species get
; their 2024 advantages (dwarf vs poison, halfling vs fear and Luck, elf vs
; charm, gnome on Will saves). !saves lists all six.
; faithful: monsters have no save proficiency, no automatic 1 / 20 (the game's
; "Saving Throw Automatic Failure On 1" option is turned off while nwn5e
; runs), no feat "+2 vs X" save bonuses, paladins get Aura of Protection from
; level 6, and a spell that asks for another ability (e.g. Strength) rolls on
; it - a chat line names it. nwn: monsters keep their good saves, NWN's flat
; feat/racial save bonuses stay, natural 20s, Spell Focus +1/+2/+3. off:
; NWN's 3e saves and DCs.
saves=
; 2024 skills. faithful: ability modifier + proficiency bonus in your
; proficient skills (twice with Expertise) + magic; no ranks, Skill Focus,
; racial bonuses or armour penalty. Choose with !skills (until then they are
; taken from your ranks); scripts read the values scaled to NWN's (2 x).
; NWN's fixed DCs (locks, traps, Search, scripts' skill checks, Tumble,
; Spellcraft, heal kits, Pick Pocket, Animal Empathy) are converted to the 2024
; scale (10 + half the excess); no trap synergy, no Rogue-only traps. With
; conditions=faithful, poisoned or frightened checks have disadvantage and a
; blinded / deafened creature fails what needs that sense.
; The creation screen's Skills page is the 2024 pick: one row per 2024 skill
; (Athletics, History, Insight, Investigation, Nature, Religion and Survival
; added), the class's count from its list plus a Human's (any) or an Elf's
; (Insight, Perception, Survival) pick, 1 point each, the background's skills
; already taken; at level-ups the 2024 gains (multiclassing into a Bard,
; Ranger or Rogue, Barbarian 3, Bard 3) and Expertise (rank 2: Rogue 1 and 6,
; Bard 2 and 9, Ranger 2 and 9, Wizard 2). Characters with NWN ranks: !skills.
; nwn (or off): NWN's ranks.
skills=
; Concentration while casting. faithful: being hit does not interrupt a spell
; you are casting, no Concentration check while entangled, and there is no
; defensive casting mode (casting draws no opportunity attacks). nwn (or off):
; NWN's Concentration checks.
concentration=
; Stealth and Perception. faithful: a hiding creature rolls Stealth once, when
; it starts hiding, and keeps that roll until it stops; others notice it with
; their passive Perception (10 + modifier) unless they search (detect mode: a
; d20); no size modifier, no -10 while in combat, no Favored Enemy bonus.
; Distance, light and movement still count. nwn (or off): NWN's (rolls every
; 6 s; an observer that isn't searching uses half its skill).
perception=
; With perception=faithful: hiding needs a Stealth total of 15 (the 2024 Hide
; action); below it you are not hidden (stop and hide again to retry). 0 =
; any total hides.
hiding_needs_15=1
; With perception=faithful: hiding works only out of sight - an enemy finds you
; when you are in front of it within 2 m with nothing between you (sneaking up
; behind still works). 0 = only the Stealth roll counts.
found_up_close=1
; With perception=faithful: creatures in combat search (an active d20
; Perception every 6 s) instead of using passive Perception. 0 = passive.
alert_creatures_search=1
; Levels and XP (CM1). faithful: the 2024 XP table (level 2 at 300, 5 at
; 6,500, 20 at 355,000), level 20 is the cap, and a script that sets XP by
; NWN's table sets the same level; XP losses never take a level. nwn (or
; off): NWN's.
progression=
; Multiclassing (CM2). faithful: no XP penalty for uneven class levels; a new
; class needs 13 in its primary ability and in every class you have; up to 8
; classes. nwn (or off): NWN's XP penalty, no ability scores needed, 3 classes.
multiclass=
; Alignment (CM14). faithful: alignment only describes your character - no
; class needs one (drifting never stops paladin or monk levels), every
; alignment can be picked at creation, items' alignment limits are ignored.
; nwn (or off): NWN's.
alignment=
; Hit points (CM3). faithful: the first level gives the hit die's maximum,
; every later level its fixed average (d6 4, d8 5, d10 6, d12 7), plus the
; Constitution modifier, with the 2024 dice (Bard and Rogue d8, Sorcerer and
; Wizard d6). Toughness adds nothing. Player characters and henchmen. nwn (or
; off): NWN's rolls.
hit_points=
; When feats come (CM7). faithful: a feat at class levels 4, 8, 12, 16 and 19
; (Fighter also 6 and 14, Rogue 10), where Ability Score Improvement is one
; choice; no general feat - the Origin feat comes with your background, and a
; human's extra level-1 feat is 2024's Versatile; no ability +1 every 4 levels
; (the level-up screen has no ability page); NWN's class bonus feats are gone.
; nwn (or off): NWN's.
feat_cadence=
; Ability scores and backgrounds (CM4, CM5). faithful: species give no ability
; increases; the creation screen's point buy is 27 points, every score from 8
; (your class's main one too) to 15 (2 points from 13); its Alignment step is
; Background, which gives +2 / +1 or +1 / +1 / +1 (!background changes it
; later); each Ability Score Improvement is chosen with !asi. nwn (or off):
; NWN's.
ability_scores=
; Class features (CM9, CM10). faithful: the SRD subclass at class level 3, no
; prestige classes, no School step (wizards stay generalists); the 2024
; features class by class (!features). Built so
; far: the Fighter (Fighting Styles, Second Wind, Champion's critical range,
; Remarkable Athlete, Tactical Shift, Indomitable, Studied Attacks, Heroic
; Rally). nwn (or off): NWN's; the Fighting Style feats are hidden and the
; feats nwn5e granted (Second Wind) are taken back.
class_features=
; Species (CM6). faithful: the 2024 species - Race reads Species, the
; Half-Orc is the SRD's Orc, each species' description lists its 2024 traits
; and what nwn5e does with them so far (the Half-Elf stays as a legacy
; species). nwn (or off): NWN's races and texts.
species=
; Which feats exist (CM8). faithful: the creation and level-up screens offer
; only the 2024 feats nwn5e has built - the Origin feats Alert (NWN's Improved
; Initiative), Savage Attacker and Skilled,
; Ability Score Improvement (from level 4), the Fighting Styles (a Fighter's
; bonus picks); characters keep the NWN feats they already have. nwn (or off):
; NWN's feats.
feats=
; Starting equipment (C2). faithful: the creation screen's packages are the
; 2024 starting kits (one per class, the Fighter two: greatsword or archer) as
; NWN items, and your background's kit is added when you enter the game.
; nwn (or off): NWN's packages.
starting_equipment=
; Rests (Phase 5). faithful: Hit Dice - one per level, your class's die; a
; Short Rest (the button next to Rest, or !shortrest) heals with them, out of
; combat, spending at least one; NWN's Rest is the Long Rest - all or nothing,
; and it gives every Hit Die back. !rest shows your Hit Dice. nwn (or off):
; NWN's rest.
rests=
; 1: a Long Rest moves the clock 8 hours, a Short Rest 1 (0: the clock stays).
rest_clock=0
; Dying (Phase 5). faithful: at 0 HP with a henchman standing you fall
; unconscious and make a death saving throw every 6 seconds (10+ a success, a
; natural 1 two failures, a natural 20 wakes you at 1 HP; 3 successes Stable, 3
; failures dead); healing or the fight's end wakes you, and you die when no
; henchman is left standing. Without a henchman, NWN's (the campaigns' death at
; 0 HP). Henchmen lie at 1 HP until you heal them (a spell, a healer's kit, or
; a Short Rest after the fight); on respawn they join you at the temple at
; full health, and a Long Rest in the temple's
; area brings any left behind. Coming back from 0 HP gives a level of
; Exhaustion (-2 to attack rolls, saves and checks, -5 ft speed per level; 6 is
; death) - a Long Rest removes it. !dying shows yours. nwn (or off): NWN's.
dying=
; What a down character looks like: visualeffects.2da rows (!vfx lists them;
; 0 = none) - an aura while making death saves and while Stable, and a flash
; for each roll (a success, a failure, a natural 1, a natural 20).
death_save_aura_vfx=512
death_save_stable_vfx=513
death_save_success_vfx=199
death_save_failure_vfx=203
death_save_nat1_vfx=217
death_save_nat20_vfx=68
; 1: a marker over a down character shows its death saves - three bars each
; side of an icon, successes left (green; blue when Stable), failures right
; (red) - always facing the camera. 0: none.
death_save_marker=1
; 1: an exhausted character looks it - Exhaustion 1-2 the tired idle, 3-5 also
; the injured walk (a limp). 0: the game's own idle and walk.
exhaustion_look=1
; 1: a badly wounded player character bleeds - mild dripping and a small puddle
; under bleed_percent of its hit points. 0: none.
low_hp_bleed=1
bleed_percent=10
; The Short Rest's visual on each resting character: a visualeffects.2da row
; (221 = Lesser Restoration's; 69 = the Cure Light Wounds potion's; 68, 67,
; 66, 70: bigger healing ones; 201: a head-level heal; 0 = none - !vfx lists
; them all), and its size in percent (100 = normal).
short_rest_vfx=221
short_rest_vfx_scale=100
; nwn5e's own 2da rows and strings (data\rows, data\strings.txt next to the
; DLL), served from build\served without touching the game install. 0 = the
; game's tables only.
served_data=1
; Initiative. faithful: d20 + your Dexterity modifier, + your proficiency bonus
; with Improved Initiative (2024's Alert); advantage while invisible,
; disadvantage while poisoned or frightened, Halfling Luck. nwn (or off):
; NWN's (+4 Improved Initiative, +8 Epic, +2 Blooded / Thug).
initiative=
; NWN's skills with no 2024 counterpart. faithful: no parry mode, Taunt does
; nothing, stores keep their own prices (no Appraise haggling - nor any
; scripted store discount), and Use Magic Device no longer lets you use items
; your class, race or alignment can't (non-casters can't read class scrolls).
; nwn (or off): NWN's.
nwn_only_skills=
; Spell attacks (rays, touch spells). faithful: your proficiency bonus + your
; spellcasting ability (a scroll's own bonus from items) against full AC, with
; advantage / disadvantage like any attack; a natural 20 is a critical hit
; without a confirmation roll. nwn (or off): NWN's touch attacks (attack bonus
; against touch AC).
spell_attacks=
; Knockdown and Disarm. faithful: Knockdown and Improved Knockdown are a 2024
; Shove - no attack roll and no damage; the target makes its better Strength or
; Dexterity save against 8 + your Strength modifier + proficiency bonus or is
; knocked down; it can be at most one size larger than you. Disarm and Improved
; Disarm are ordinary attacks (2024 has no disarming). nwn (or off): NWN's
; (attack roll, then Discipline).
knockdown=

[debug]
; Test switches, all off by default.
; every_hit_crits=1: every hit threatens and is a critical (critical immunity
; still applies) - to see crit damage and crits_against_players quickly.
every_hit_crits=0
; combat_breakdown=1: the engine's own per-term attack and damage breakdown.
combat_breakdown=0
; attacks_per_round=N (1-6): player characters make N main-hand attacks.
attacks_per_round=0
; creature_ac=N: every monster has AC N (40 forces misses, so a round's
; attacks are all rolled).
creature_ac=0
; creature_hp_multiplier=N / creature_min_hp=N: a monster gets N times its hit
; points / at least N the first time your party attacks it (so weak monsters
; survive several hits).
creature_hp_multiplier=0
creature_min_hp=0
; attack_trace=1: log the round's attack counts and every PC attack roll.
attack_trace=0
; served_data_probe=1: a hidden test row in feat.2da, checked after load.
served_data_probe=0
; nui_test=1: nwn5e's NUI test window opens 3 s after your character arrives
; (!nui opens it any time).
nui_test=0
; client_nui_test=1: nwn5e's client window test opens on the main menu (EE's
; own NUI, no game loaded).
client_nui_test=0
; test_commands=1: chat commands for testing - !test gives your character
; the setup in data	est.txt next to nwn5e.dll (species, levels in a class,
; ability scores, feats, items; read each time, so a new test is a new file);
; !give <item blueprint> [stack] puts that item in your inventory (e.g.
; !give nw_ashto001 for a Tower Shield); !feat add <feat> / !feat remove
; <feat> changes your feats (a feat number, or alert, savage attacker,
; skilled, archery, defense, great weapon fighting, two-weapon fighting,
; asi 1..7, mastery <weapon>). No checks. (give_command=1, its earlier name,
; still works.)
test_commands=0
