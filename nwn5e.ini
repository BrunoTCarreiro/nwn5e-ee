; nwn5e (EE) settings. 1 = 2024 rule, 0 = the game's own behaviour. Rules
; arrive here as they are ported from the 1.69 build (docs/EE-PORT.md).
[loader]
; Leave empty for the Steam default: X:\SteamLibrary\steamapps\common\Neverwinter Nights
game_dir=

[rules]
; faithful = D&D 2024 as written; nwn = 2024 with NWN's own choices kept where
; they exist for gameplay; off = the game's behaviour. The default for every
; rule that has both versions (none ported yet); each can override it.
mode=faithful
; 2024 critical hits: a critical threat only on a natural 20 (not the
; weapon's 19-20 / 18-20; the character sheet shows 20 too).
crit_nat20_only=1
; ... and a threat is a critical hit at once: no confirmation roll, no
; "Threat Roll" in the combat log. Critical immunity still applies.
crit_no_confirmation=1
; Every weapon crits for double damage (x2, not x3 / x4).
crit_double_damage=1
; A critical rolls the damage dice twice, but Strength and other flat bonuses
; (also flat effect bonuses, e.g. Divine Favor) count once.
crit_dice_only=1
; Creatures can crit your party at every difficulty (the game turns their
; critical hits on player characters into hits at Easy and Normal).
crits_against_players=1
; Write each rule decision to nwn5e.log (once per distinct case).
log_attacks=1

[debug]
; Test switches, all off by default.
; every_hit_crits=1: every hit threatens and is a critical (critical immunity
; still applies) - to see crit damage and crits_against_players quickly.
every_hit_crits=0
; combat_breakdown=1: the engine's own per-term attack and damage breakdown.
combat_breakdown=0
