; nwn5e (EE) settings. 1 = 2024 rule, 0 = the game's own behaviour. Rules
; arrive here as they are ported from the 1.69 build (docs/EE-PORT.md).
[loader]
; Leave empty for the Steam default: X:\SteamLibrary\steamapps\common\Neverwinter Nights
game_dir=

[rules]
; faithful = D&D 2024 as written; nwn = 2024 with NWN's own choices kept where
; they exist for gameplay; off = the game's behaviour. The default for every
; rule that has both versions (none ported yet); each can override it.
mode=faithful
; 2024 critical hits: a critical threat only on a natural 20 (not the
; weapon's 19-20 / 18-20; the character sheet shows 20 too).
crit_nat20_only=1
; ... and a threat is a critical hit at once: no confirmation roll, no
; "Threat Roll" in the combat log. Critical immunity still applies.
crit_no_confirmation=1
; Every weapon crits for double damage (x2, not x3 / x4).
crit_double_damage=1
; A critical rolls the damage dice twice, but Strength and other flat bonuses
; (also flat effect bonuses, e.g. Divine Favor) count once.
crit_dice_only=1
; Creatures can crit your party at every difficulty (the game turns their
; critical hits on player characters into hits at Easy and Normal).
crits_against_players=1
; Write each rule decision to nwn5e.log (once per distinct case).
log_attacks=1
; Attack rolls use the proficiency bonus (by level for characters, by
; challenge rating for monsters) instead of the 3e base attack bonus; the
; character sheet shows the same numbers.
attack_proficiency=1
; Monsters, summons and companions use the 2024 expected AC for their
; challenge rating; player characters and henchmen keep their gear AC.
creature_ac_by_cr=1
; Player characters and henchmen attack per 2024 Extra Attack, and no attack
; takes the 3e -5 (iterative, off-hand, opportunity, Haste, Flurry).
extra_attack=1
; 2024 advantage / disadvantage instead of NWN's situational bonuses
; (blind, invisible, prone, stunned, flanked, moving targets); a ranged attack
; with an enemy within 5 ft that sees you has disadvantage (Point Blank Shot
; cancels it).
advantage_disadvantage=1
; After a kill, the round's remaining attacks go to the nearest enemy; a
; ranged attack only to an enemy already in the fight, within this range (m).
retarget_remaining_attacks=1
ranged_retarget_range=40
; NWN's racial bonuses against specific enemies (Battle Training, Good Aim,
; the halfling sling, +4 AC vs giants): faithful removes them; nwn keeps them.
racial_combat_bonuses=
; Two-weapon fighting: faithful = no attack penalties, one off-hand attack
; (two Light weapons, a double weapon or Improved Two-Weapon Fighting), no
; Strength on its damage unless negative or with Two-Weapon Fighting; nwn
; keeps NWN's.
two_weapon_fighting=
; Two-handed weapons: faithful adds Strength once, nwn keeps NWN's 1.5 x.
two_handed_strength=
; Opportunity attacks: faithful = only moving away provokes (no AoO for
; casting, drinking potions, ranged shots, unarmed attacks or Disarm), only
; from creatures you run away from, and Spring Attack no longer protects; nwn
; keeps NWN's.
opportunity_attacks=
; After drinking a potion mid-fight, your character goes back to attacking
; its last target (or the nearest enemy it sees within 10 m).
resume_attack_after_potion=1
; Conditions: faithful = 2024 restrained (no -2 attack / -4 Dex; advantage
; against it, disadvantage on its attacks), stunned / paralysed / asleep
; targets give advantage (a hit from within 5 ft on a paralysed or sleeping
; one is a critical), poisoned attackers have disadvantage, frightened = no
; fleeing but disadvantage while the source is in sight, concealment =
; disadvantage instead of a miss chance, deafness adds no spell failure, no
; coup de grace; nwn keeps NWN's (stunned / paralysed / asleep targets still
; give advantage).
conditions=
; Weapon mastery: faithful = 2024 slots by class (Barbarian, Fighter,
; Paladin, Ranger, Rogue), chosen with !mastery or filled with the weapons you
; fight with, one swap per long rest; nwn = those classes master every weapon
; they are proficient with. Weapon Focus adds its weapon in both. Effects:
; Vex, Sap, Graze, Slow, Topple, Cleave, and in faithful Push (10 ft away,
; stopped by walls and placeables; the creature falls and its round pauses).
weapon_mastery=
; 2024 saving throws. Fortitude / Reflex / Will are your Constitution /
; Dexterity / Wisdom saves: ability modifier + proficiency bonus in your first
; class's saves (Great Fortitude, Lightning Reflexes, Iron Will add one) +
; magic. Spell DCs are 8 + proficiency bonus + casting modifier; traps,
; poisons and other fixed DCs are converted to the 2024 scale. Species get
; their 2024 advantages (dwarf vs poison, halfling vs fear and Luck, elf vs
; charm, gnome on Will saves). !saves lists all six.
; faithful: monsters have no save proficiency, no automatic 1 / 20 (the game's
; "Saving Throw Automatic Failure On 1" option is turned off while nwn5e
; runs), no feat "+2 vs X" save bonuses, paladins get Aura of Protection from
; level 6, and a spell that asks for another ability (e.g. Strength) rolls on
; it - a chat line names it. nwn: monsters keep their good saves, NWN's flat
; feat/racial save bonuses stay, natural 20s, Spell Focus +1/+2/+3. off:
; NWN's 3e saves and DCs.
saves=
; 2024 skills. faithful: ability modifier + proficiency bonus in your
; proficient skills (twice with Expertise) + magic; no ranks, Skill Focus,
; racial bonuses or armour penalty. Choose with !skills (until then they are
; taken from your ranks); scripts read the values scaled to NWN's (2 x).
; nwn (or off): NWN's ranks.
skills=
; Concentration while casting. faithful: being hit does not interrupt a spell
; you are casting, no Concentration check while entangled, and there is no
; defensive casting mode (casting draws no opportunity attacks). nwn (or off):
; NWN's Concentration checks.
concentration=
; Initiative. faithful: d20 + your Dexterity modifier, + your proficiency bonus
; with Improved Initiative (2024's Alert); advantage while invisible,
; disadvantage while poisoned or frightened, Halfling Luck. nwn (or off):
; NWN's (+4 Improved Initiative, +8 Epic, +2 Blooded / Thug).
initiative=
; NWN's skills with no 2024 counterpart. faithful: no parry mode, Taunt does
; nothing, stores keep their own prices (no Appraise haggling - nor any
; scripted store discount), and Use Magic Device no longer lets you use items
; your class, race or alignment can't (non-casters can't read class scrolls).
; nwn (or off): NWN's.
nwn_only_skills=
; Spell attacks (rays, touch spells). faithful: your proficiency bonus + your
; spellcasting ability (a scroll's own bonus from items) against full AC, with
; advantage / disadvantage like any attack; a natural 20 is a critical hit
; without a confirmation roll. nwn (or off): NWN's touch attacks (attack bonus
; against touch AC).
spell_attacks=
; Knockdown and Disarm. faithful: Knockdown and Improved Knockdown are a 2024
; Shove - no attack roll and no damage; the target makes its better Strength or
; Dexterity save against 8 + your Strength modifier + proficiency bonus or is
; knocked down; it can be at most one size larger than you. Disarm and Improved
; Disarm are ordinary attacks (2024 has no disarming). nwn (or off): NWN's
; (attack roll, then Discipline).
knockdown=

[debug]
; Test switches, all off by default.
; every_hit_crits=1: every hit threatens and is a critical (critical immunity
; still applies) - to see crit damage and crits_against_players quickly.
every_hit_crits=0
; combat_breakdown=1: the engine's own per-term attack and damage breakdown.
combat_breakdown=0
; attacks_per_round=N (1-6): player characters make N main-hand attacks.
attacks_per_round=0
; creature_ac=N: every monster has AC N (40 forces misses, so a round's
; attacks are all rolled).
creature_ac=0
; creature_hp_multiplier=N / creature_min_hp=N: a monster gets N times its hit
; points / at least N the first time your party attacks it (so weak monsters
; survive several hits).
creature_hp_multiplier=0
creature_min_hp=0
; attack_trace=1: log the round's attack counts and every PC attack roll.
attack_trace=0
